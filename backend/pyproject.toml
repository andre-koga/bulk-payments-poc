[project]
name = "bulk-payments"
version = "0.1.0"
description = "POC: precision-first bulk payment to bill matching"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bulk-match = "bulk_payments.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_payments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
