[project]
name = "bulk-payments"
version = "0.1.0"
description = "POC: precision-first bulk payment to bill matching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
agent = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langsmith>=0.2",
    "pydantic>=2.0",
    "langgraph>=0.3",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "langchain-community>=0.3"]

[project.scripts]
bulk-match = "bulk_payments.cli:main"
bulk-api = "bulk_payments.api_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_payments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live LLM tests, skipped unless API keys are present",
]
